<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Заметка на холодильнике</h1>
        <div class="frige-note">
            <textarea id="noteArea" placeholder="Напишите вашу заметку здесь">
            </textarea>
            <button class="save-btn" onclick="saveNote()" >Сохранить текст</button>
            <p class="save-message" id="saveMessage">Заметка сохранена</p>
            <button class="remove-btn" onclick="clearNote()">Удалить</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
