<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Любимый цвет</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Выбери любимый цвет</h1>
    </header>
    <main>
        <section class="card">
            <h2>Красный</h2>
            <button onclick="changeColor('red')" id="color-red">Выбрать</button>
        </section>
        <section class="card">
            <h2>Синий</h2>
            <button onclick="changeColor('blue')" id="color-blue">Выбрать</button>
        </section>
        <section class="card">
            <h2>Зеленый</h2>
            <button onclick="changeColor('green')" id="color-green">Выбрать</button>
        </section>
    </main>
    <script src="index.js"></script>
</body>
</html>
