<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор мест</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/clienthall.css">
    <script src="../js/clienthall.js" type="module" defer></script>
</head>
<body>
    <div class="container">
        <div class="film-info">
            <h1 class="film-name" id="film-name">Название фильма</h1>
            <div class="seance-info">
                <span class="seance-time" id="seance-time">00:00</span>
                <span class="hall-name" id="hall-name">Зал №</span>
            </div>
        </div>
        <div class="hall-container" id="hall-container">
            <div class="screen">
                Экран
            </div>
            <div class="seats-container" id="seats-container">
                <div class="seats-row">
                    <div class="seat seat-vip"></div>
                    <div class="seat seat-taken"></div>
                    <div class="seat seat-standart"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                </div>
            </div>
        </div>
        <div class="ticket-panel">
            <div class="ticket-price">
                <h3 class="ticket-price-title">Цена:</h3>
                <p class="standart-price">Стандартный билет:<span id="standart-price"></span></p>
                <p class="vip-price">Вип билет:<span id="vip-price"></span></p>
            </div>
            <div class="ticket-counter">
                <p class="standart-seats">Обычные:<span id="standart-count">0</span></p>
                <p class="vip-seats">VIP:<span id="vip-count">0</span></p>
                <p class="total-price">Итог: <span id="total-price">0</span>руб.</p>
            </div>
            <button class="book-btn" id="book-btn">Забронировать</button>
        </div>
    </div>    
</body>
</html>
