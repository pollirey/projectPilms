<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/booking.css">
    <script src="../js/booking.js" defer></script>
</head>
<body>
    <div class="container">
        <h1 class="page-title">Оформление бронирования</h1>
        <div class="booking-form">
            <div class="booking-header">
                <h2 class="film-title" id="booking-film-name">Название фильма</h2>
                <div class="booking-info">
                    <div class="info-item">
                        <span class="info-lable">Дата: </span>
                        <span class="info-value" id="booking-date"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-lable">Время: </span>
                        <span class="info-value" id="booking-time"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-lable">Зал: </span>
                        <span class="info-value" id="booking-hall"></span>
                    </div>
                </div>
            </div>
            <div class="seats-summary">
                <h3>Выбранные места</h3>
                <div class="seats-list" id="seats-list"> 
                    
                </div>
            </div>
        </div>
    </div>
</body>
</html>
