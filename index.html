<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="js/index.js" defer type="module"></script>
</head>
<body>
    <div class="container">
        <div class="container-top">
            <h1 class="container-title">Расписание сеансов</h1>
            <div class="search-container">
                <input class="search-input" type="text" placeholder="Поиск фильма по названию" id="searchInput">
            </div>
        </div>
        <div class="films-container" id="filmsContainer">
            <div class="film-card">
                <img class="film-img" src="" alt="">
                <div class="film-info">
                    <h4 class="film-name">Название фильма</h4>
                    <p class="film-description">Описание фильма</p>
                    <p class="film-duration">Длительность фильма</p>
                    <p class="film-origin">Страна происхождения</p>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
