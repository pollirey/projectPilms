<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/index.js" defer type="module"></script>
</head>
<body>
    <div class="container">
        <div class="container-top">
            <h1 class="container-title">Расписание 
                сеансов</h1>
            <div class="search-container">
                <input class="search-input" type="text" placeholder="Поиск фильма по названию" id="searchInput">
            </div>
        </div>
        <div class="films-container" id="filmsContainer">
            <div class="film-card">
                <img class="film-img" src="" alt="">
                <div class="film-info">
                    <h4 class="film-name">Название фильма</h4>
                    <p class="film-description">Описание фильма</p>
                    <p class="film-duration">Длительность фильма</p>
                    <p class="film-origin">Страна происхождения</p>
                </div>
            </div>
        </div>
        <div class="accordion">
            <div class="accordion-item active">
                <button class="accordion-header">
                    <p class="accordion-question">
                        Как оплатить билет?
                    </p>
                    <svg class="arrow-bottom" viewBox="0 0 5 9">
                        <path d="M0.419,9.000 L0.003,8.606 L4.164,4.500 L0.003,0.394 L0.419,0.000 L4.997,4.500 L0.419,9.000 Z" />
                    </svg>
                </button>
                <div class="accordion-content">
                    <div class="accordion-body">
                        <p class="accordion-answer"> Выберите нужный зал и оплатите</p>
                    </div>
                </div>
            </div>
            <div class="accordion-item">
                <button class="accordion-header">
                    <p class="accordion-question">
                        Можно ли купить попкорн в кинотеатре?
                    </p>
                    <svg class="arrow-bottom" viewBox="0 0 5 9">
                        <path d="M0.419,9.000 L0.003,8.606 L4.164,4.500 L0.003,0.394 L0.419,0.000 L4.997,4.500 L0.419,9.000 Z" />
                    </svg>
                </button>
                <div class="accordion-content">
                    <div class="accordion-body">
                        <p class="accordion-answer"> Да, в кинотеатре можно приобрести свежий попкорн на кассе</p>
                    </div>
                </div>
            </div>
            <div class="accordion-item">
                <button class="accordion-header">
                    <p class="accordion-question">
                        Возможно приобрести билеты по Пушкинской карте?
                    </p>
                    <svg class="arrow-bottom" viewBox="0 0 5 9">
                        <path d="M0.419,9.000 L0.003,8.606 L4.164,4.500 L0.003,0.394 L0.419,0.000 L4.997,4.500 L0.419,9.000 Z" />
                    </svg>
                </button>
                <div class="accordion-content">
                    <div class="accordion-body">
                        <p class="accordion-answer"> Да, возможно</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
